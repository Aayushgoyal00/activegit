[package]
name = "activegit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "A fast, keyboard-driven git TUI: status, side-by-side diffs, hunk staging, AI commit messages"
readme = "../README.md"
keywords = ["git", "tui", "terminal", "diff", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "activegit"
path = "src/main.rs"

[dependencies]
git-tui-core = { path = "../git-tui-core" }
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
similar = "2.7.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.9.6"
toml_edit = "0.22"
unicode-width = "0.1"
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-onig"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["simd"] }
dunce = "1"

[dev-dependencies]
tempfile = "3"
git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }
